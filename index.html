<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapbook</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Kalam:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Dekorasi latar belakang -->
        <div class="deco camera">📷</div>
        <div class="deco flower">🌼</div>
        <div class="deco ticket">🎫</div>
        
        <!-- Elemen selotip -->
        <div class="tape tape-top"></div>

        <!-- Kartu Utama -->
        <div class="scrapbook-card">
            <div class="clip">📎</div>
            <div class="word">
                <span class="letter c-pink tilt-l">S</span>
                <span class="letter c-white tilt-r">C</span>
                <span class="letter c-blue tilt-l">R</span>
                <span class="letter c-dark tilt-r">A</span>
                <span class="letter c-yellow tilt-l">P</span>
            </div>
            <div class="word">
                <span class="letter c-white tilt-r">B</span>
                <span class="letter c-pink tilt-l">O</span>
                <span class="letter c-white tilt-r">O</span>
                <span class="letter c-red tilt-l">K</span>
            </div>
        </div>

        <div class="tape tape-bottom"></div>

        <!-- Teks dan Tombol -->
        <p class="subtitle">Aku punya sesuatu buat kamu...</p>
        <button class="btn-open">Buka Scrapbook</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
